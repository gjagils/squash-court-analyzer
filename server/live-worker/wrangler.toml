# Squash Analyzer — live meekijken on Cloudflare Workers (live.squashanalyzer.com, beta as alias).
# Deploy: npx wrangler deploy (after `npx wrangler login`). See README.md.
name = "squash-live-beta"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = false
routes = [
  { pattern = "live.squashanalyzer.com", custom_domain = true },
  { pattern = "beta.squashanalyzer.com", custom_domain = true },
]

[vars]
PUBLIC_URL = "https://live.squashanalyzer.com"
IDLE_MINUTES = "120"
MAX_SESSIONS = "200"
CREATES_PER_MINUTE = "10"
GLOBAL_CREATES_PER_MINUTE = "60"
MAX_VIEWERS_PER_SESSION = "200"
# Where the wedstrijd data is stored: "eu" keeps the objects in the European
# Union (Cloudflare jurisdiction). Empty = no restriction (also in the local
# tests: workerd has no jurisdictions). Changing it makes running sessions
# unfindable (they last two hours at most). Switched on 6 October 2026, with
# the one running session (Gerd-Jan's own) given up.
LIVE_JURISDICTION = "eu"

# The viewer page and the logo; the Worker runs first and fills the page in
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "SESSION"
class_name = "LiveSession"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "LiveLimiter"

[[durable_objects.bindings]]
name = "TEAM"
class_name = "TeamSession"

# SQLite-backed objects: the kind the free plan allows
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveSession", "LiveLimiter"]

# Live team matches (Competitie): one object per team match
[[migrations]]
tag = "v2"
new_sqlite_classes = ["TeamSession"]

[observability]
enabled = true
