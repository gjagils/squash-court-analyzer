<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badgekaart – SquashAnalyzer</title>
  <meta name="description" content="Badgekaart van een squashspeler, gedeeld vanuit SquashAnalyzer." />
  <meta name="robots" content="noindex" />
  <meta property="og:title" content="Badgekaart – SquashAnalyzer" />
  <meta property="og:description" content="Bekijk de badges die in squashwedstrijden zijn verdiend." />
  <meta property="og:image" content="https://www.squashanalyzer.com/logo.png?v=4" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=android,assignment,auto_awesome,backup,fast_forward,groups,history,home,install_mobile,leaderboard,local_cafe,lock,menu_book,military_tech,new_releases,psychology,replay,sensors,settings,sports&display=block" />
  <link rel="stylesheet" href="../style.css?v=20261004b" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=5" />
  <link rel="icon" type="image/png" sizes="256x256" href="../favicon.png?v=5" />
  <link rel="apple-touch-icon" href="../logo.png?v=4" />
  <style>
    .card-page { max-width: 480px; margin: 0 auto; padding: 32px 20px 56px; }
    .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
    .card-label { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); font-weight: 600; }
    .card-name { font-size: 28px; font-weight: 700; margin: 6px 0 20px; overflow-wrap: anywhere; }
    .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 18px 12px; }
    .badge { text-align: center; }
    .medal { width: 76px; height: 76px; margin: 0 auto 6px; border-radius: 50%; display: flex;
             align-items: center; justify-content: center; font-size: 40px; background: rgba(242,140,38,0.12); }
    .medal img { width: 100%; height: 100%; display: block; }
    .badge.locked .medal { filter: grayscale(1); opacity: 0.35; }
    .badge.locked .badge-title { color: var(--text-3); }
    .badge-detail { font-size: 11px; color: var(--text-3); line-height: 1.3; }
    .badge-title { font-size: 13px; color: var(--text-1); }
    .badge-count { font-size: 14px; font-weight: 700; color: var(--gold); }
    .moments { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px; }
    .moments h2 { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
    .moment { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--border); }
    .moment:last-child { border-bottom: 0; }
    .moment span:last-child { color: var(--text-3); white-space: nowrap; }
    .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
    .actions[hidden] { display: none; }
    .actions a { display: block; text-align: center; padding: 14px; border-radius: 12px; font-weight: 600; }
    .open-app { background: var(--orange); color: #000; }
    .get-app { background: var(--surface); border: 1px solid var(--line); color: var(--text-1); }
    .note { margin-top: 20px; font-size: 13px; color: var(--text-3); }
    .error { color: var(--text-2); }
  </style>
</head>
<body>
  <main class="card-page">
    <div class="card" id="card">
      <p class="error" id="status">Kaart laden…</p>
    </div>
    <div class="actions" id="actions" hidden>
      <a class="open-app" id="open-app" href="#">Open in SquashAnalyzer</a>
      <a class="get-app" href="https://apps.apple.com/app/squash-analyzer/id6758676921" target="_blank" rel="noopener">Download de app</a>
    </div>
    <p class="note">De kaart staat in de link zelf. Deze pagina stuurt niets naar een server en bewaart niets.</p>
  </main>

  <script>
    // Badges as in BadgeKind (the app); unknown ids are skipped. A badge with
    // tiers lists the ids of its bronze, silver and gold tier (the old "perfect-ten"
    // is the gold tier of "five-in-a-row"); its artwork is ../badges/<id>-<tier>.png,
    // a plain badge's ../badges/<id>.png. A badge without artwork gets a medal.
    const TIERS = ["bronze", "silver", "gold"];
    const TIER_NAMES = ["Brons", "Zilver", "Goud"];
    const BADGES = [
      {"id": "five-in-a-row", "title": "5 points in a row", "detail": "5 punten achter elkaar", "tiers": ["five-in-a-row", "five-in-a-row-silver", "perfect-ten"], "summary": "Brons 5 · Zilver 7 · Goud 10"},
      {"id": "eleven-nil", "title": "Alles is voor Bassie", "detail": "Win een game met 11-0"},
      {"id": "drop-it", "title": "Drop it like it's hot", "detail": "4 drops in één game", "tiers": ["drop-it", "drop-it-silver", "drop-it-gold"], "summary": "Brons 4 · Zilver 6 · Goud 8"},
      {"id": "kriss-cross", "title": "Kriss Kross", "detail": "4 crosses in één game", "tiers": ["kriss-cross", "kriss-cross-silver", "kriss-cross-gold"], "summary": "Brons 4 · Zilver 6 · Goud 8"},
      {"id": "back-from-the-death", "title": "Back from the dead", "detail": "Win een game na 5 punten achterstand", "tiers": ["back-from-the-death", "back-from-the-death-silver", "back-from-the-death-gold"], "summary": "Brons 5 · Zilver 7 · Goud 9"},
      {"id": "going-the-distance", "title": "Going the distance", "detail": "Win de wedstrijd na 0-2 in games"},
      {"id": "ace-of-pace", "title": "Ace of pace", "detail": "4 servicewinners in één game", "tiers": ["ace-of-pace", "ace-of-pace-silver", "ace-of-pace-gold"], "summary": "Brons 4 · Zilver 6 · Goud 8"},
      {"id": "lob-story", "title": "Lob story", "detail": "4 lobwinners in één game", "tiers": ["lob-story", "lob-story-silver", "lob-story-gold"], "summary": "Brons 4 · Zilver 6 · Goud 8"},
      {"id": "volleywood", "title": "Volleywood", "detail": "4 volleywinners in één game", "tiers": ["volleywood", "volleywood-silver", "volleywood-gold"], "summary": "Brons 4 · Zilver 6 · Goud 8"},
      {"id": "clean-sweep", "title": "Clean sweep", "detail": "Win de wedstrijd met 3-0"},
      {"id": "cool-under-pressure", "title": "Cool under pressure", "detail": "Win een game na 10-10"},
      {"id": "drive-me-crazy", "title": "Drive me crazy", "detail": "4 drivewinners in één game", "tiers": ["drive-me-crazy", "drive-me-crazy-silver", "drive-me-crazy-gold"], "summary": "Brons 4 · Zilver 6 · Goud 8"},
      {"id": "boast-buster", "title": "Boast buster", "detail": "4 boastwinners in één game", "tiers": ["boast-buster", "boast-buster-silver", "boast-buster-gold"], "summary": "Brons 4 · Zilver 6 · Goud 8"},
      {"id": "full-house", "title": "Full house", "detail": "Scoor met alle 6 slagtypes in één wedstrijd"},
      {"id": "hat-trick", "title": "Hat trick", "detail": "Win 3 wedstrijden op rij", "tiers": ["hat-trick", "hat-trick-silver", "hat-trick-gold"], "summary": "Brons 3 · Zilver 5 · Goud 7"},
      {"id": "houdini", "title": "Houdini", "detail": "Werk 3 matchpoints weg en win de wedstrijd"},
      {"id": "marathon-man", "title": "Marathon man", "detail": "Win een game met minstens 20 punten"},
      {"id": "off-the-mark", "title": "Off the mark", "detail": "Win je eerste wedstrijd"},
      {"id": "centurion", "title": "Centurion", "detail": "Scoor in totaal 100 punten", "tiers": ["centurion", "centurion-silver", "centurion-gold"], "summary": "Brons 100 · Zilver 500 · Goud 1000"},
      {"id": "double-trouble", "title": "Double trouble", "detail": "Win 2 games na 10-10 in één wedstrijd"},
      {"id": "ten-out-of-ten", "title": "Ten out of ten", "detail": "Win in totaal 10 wedstrijden", "tiers": ["ten-out-of-ten", "ten-out-of-ten-silver", "ten-out-of-ten-gold"], "summary": "Brons 10 · Zilver 25 · Goud 50"},
      {"id": "brick-wall", "title": "Brick wall", "detail": "Win een game zonder unforced errors"},
      {"id": "front-row-king", "title": "Front row king", "detail": "5 winners vanuit de voorste zones in één game", "tiers": ["front-row-king", "front-row-king-silver", "front-row-king-gold"], "summary": "Brons 5 · Zilver 7 · Goud 9"},
      {"id": "endurance", "title": "Endurance", "detail": "Win een rally van minstens 60 seconden", "tiers": ["endurance", "endurance-silver", "endurance-gold"], "summary": "Brons 60 s · Zilver 90 s · Goud 120 s"},
      {"id": "unbreakable", "title": "Unbreakable", "detail": "Win een game zonder ooit achter te staan"},
      {"id": "photo-finish", "title": "Photo finish", "detail": "Win een wedstrijd met 3-2"},
      {"id": "stroke-of-genius", "title": "Stroke of genius", "detail": "Krijg 3 strokes toegekend in één game"},
      {"id": "iron-man", "title": "Iron man", "detail": "Speel een wedstrijd van minstens 60 minuten uit", "tiers": ["iron-man", "iron-man-silver", "iron-man-gold"], "summary": "Brons 60 min · Zilver 75 min · Goud 90 min"},
      {"id": "nemesis", "title": "Nemesis", "detail": "Win 5 keer van dezelfde tegenstander", "tiers": ["nemesis", "nemesis-silver", "nemesis-gold"], "summary": "Brons 5 · Zilver 10 · Goud 20"},
      {"id": "veteran", "title": "Veteran", "detail": "Speel 25 wedstrijden, gewonnen of niet", "tiers": ["veteran", "veteran-silver", "veteran-gold"], "summary": "Brons 25 · Zilver 50 · Goud 100"},
      {"id": "rock-solid", "title": "Rock solid", "detail": "Win de wedstrijd zonder één unforced error"},
      {"id": "back-wall-boss", "title": "Back wall boss", "detail": "5 winners vanuit de achterste zones in één game"},
      {"id": "sneltrein", "title": "Sneltrein", "detail": "Win een game in minder dan 6 minuten"},
      {"id": "vette-winst", "title": "Vette winst", "detail": "Win de wedstrijd zonder dat de tegenstander in een game boven de 5 komt"},
      {"id": "clubicoon", "title": "Clubicoon", "detail": "Speel tegen 10 verschillende tegenstanders"},
      {"id": "rivalen", "title": "Rivalen", "detail": "Speel 10 wedstrijden tegen dezelfde tegenstander"},
      {"id": "hand-out-held", "title": "Hand-out held", "detail": "Win 5 rally's achter elkaar op de service van de ander"},
    ];
    // Every badge id → its badge and tier (null for a badge without tiers)
    const KIND = {};
    for (const badge of BADGES) {
      if (badge.tiers) badge.tiers.forEach((id, tier) => { KIND[id] = { badge, tier }; });
      else KIND[badge.id] = { badge, tier: null };
    }

    function decodeBase64Url(text) {
      const base64 = text.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((text.length + 3) % 4);
      const binary = atob(base64);
      return Uint8Array.from(binary, c => c.charCodeAt(0));
    }

    // The same limits as the apps (CardSnapshot): a real card is a few KB
    const MAX_PAYLOAD = 64 * 1024;
    const MAX_INFLATED = 256 * 1024;

    // Read in chunks and stop past the limit, so a tiny "zip bomb" cannot fill memory
    async function inflate(bytes) {
      const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")).getReader();
      const chunks = [];
      let total = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        total += value.length;
        if (total > MAX_INFLATED) { await reader.cancel(); throw new Error("too large"); }
        chunks.push(value);
      }
      const all = new Uint8Array(total);
      let offset = 0;
      for (const chunk of chunks) { all.set(chunk, offset); offset += chunk.length; }
      return new TextDecoder().decode(all);
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function render(card, payload) {
      const box = document.getElementById("card");
      box.replaceChildren();
      box.append(el("div", "card-label", "Badgekaart"), el("div", "card-name", card.n));

      const active = (card.a || []).filter(a => a.d == null && KIND[a.b]);
      const badges = el("div", "badges");
      for (const badge of BADGES) {
        // A badge with tiers: the highest tier earned, counted by the tier with
        // the most moments (bronze comes with every silver or gold), as in the app
        const ids = badge.tiers || [badge.id];
        const counts = ids.map(id => active.filter(a => a.b === id).length);
        let best = -1;
        counts.forEach((n, index) => { if (n > 0) best = index; });
        const count = Math.max(...counts);
        const item = el("div", count > 0 ? "badge" : "badge locked");
        const medal = el("div", "medal");
        const img = document.createElement("img");
        img.src = "../badges/" + (badge.tiers ? badge.id + "-" + TIERS[Math.max(best, 0)] : badge.id) + ".png";
        img.alt = "";
        img.onerror = () => { img.remove(); medal.textContent = "🏅"; };
        medal.append(img);
        item.append(medal, el("div", "badge-title", badge.title));
        const earned = badge.tiers && best >= 0 ? TIER_NAMES[best] + " · " + count + "×" : count + "×";
        item.append(count > 0 ? el("div", "badge-count", earned) : el("div", "badge-detail", badge.detail));
        badges.append(item);
      }
      box.append(badges);

      if (active.length > 0) {
        const moments = el("div", "moments");
        moments.append(el("h2", null, "Verdiend"));
        const formatter = new Intl.DateTimeFormat("nl-NL", { day: "numeric", month: "short", year: "numeric" });
        for (const award of active.sort((x, y) => y.t - x.t)) {
          const row = el("div", "moment");
          const kind = KIND[award.b];
          const what = kind.badge.title + (kind.tier == null ? "" : " · " + TIER_NAMES[kind.tier]) + (award.o ? " · tegen " + award.o : "");
          row.append(el("span", null, what), el("span", null, formatter.format(new Date(award.t * 1000))));
          moments.append(row);
        }
        box.append(moments);
      } else {
        box.append(el("p", "note", "Nog geen badges verdiend."));
      }

      document.title = "Badgekaart " + card.n + " – SquashAnalyzer";
      document.getElementById("open-app").href = "squashanalyzer://kaart#" + payload;
      document.getElementById("actions").hidden = false;
    }

    (async () => {
      const payload = location.hash.slice(1);
      const status = document.getElementById("status");
      if (!payload) { status.textContent = "Deze link bevat geen kaart."; return; }
      try {
        if (payload.length > MAX_PAYLOAD) throw new Error("too long");
        const card = JSON.parse(await inflate(decodeBase64Url(payload)));
        if (!card || typeof card.n !== "string") throw new Error("geen kaart");
        render(card, payload);
      } catch (e) {
        status.textContent = "Deze kaart kan niet worden gelezen. Vraag om een nieuwe link.";
      }
    })();
  </script>
</body>
</html>
