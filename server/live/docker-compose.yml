# Portainer stack (Stacks → Add stack → Repository): repository
# gjagils/squash-court-analyzer, compose path server/live/docker-compose.yml.
# PUBLIC_URL is the address people get in WhatsApp; whatever is in front
# (here a Cloudflare Tunnel: live.squashanalyzer.com → http://<nas>:LIVE_PORT)
# handles HTTPS. See server/live/README.md.
services:
  squash-live:
    build: .
    image: squash-live:latest
    container_name: squash-live
    restart: unless-stopped
    # Docker's default bridge: the NAS has no address pool left for a new
    # network per stack ("could not find an available, non-overlapping IPv4
    # address pool")
    network_mode: bridge
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://live.squashanalyzer.com}
      # Minutes without an update before a session is removed (lost phone, no network)
      IDLE_MINUTES: ${IDLE_MINUTES:-120}
      MAX_SESSIONS: ${MAX_SESSIONS:-200}
      # Behind the Cloudflare Tunnel: the client IP comes from CF-Connecting-IP
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - "${LIVE_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
