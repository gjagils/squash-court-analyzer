# Squash Analyzer 4.0: the player account (docs/voorstel-spelersaccount-4.0.md).
# The database was created in the EU on 1 November 2026 (the jurisdiction can
# only be set at creation): npx wrangler d1 create squash-account --jurisdiction eu.
# Deployed by hand from the Mac (README), not by CI. The app only talks to this
# Worker in 4.0 test builds (Features.playerAccount).
name = "squash-account"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = false
# The address in the app (AccountEndpoints.productionAccountURL)
routes = [{ pattern = "account.squashanalyzer.com", custom_domain = true }]

[vars]
# The Firebase project whose ID tokens are accepted (aud and iss of the token)
FIREBASE_PROJECT_ID = "squash-analyzer-18fb3"
# Requests that wait for an answer are wiped after this many days
PENDING_DAYS = "90"
# Matches one phone may send per day, and phone keys one address may create per hour
SUBMISSIONS_PER_DAY = "20"
DEVICES_PER_HOUR = "5"

[[d1_databases]]
binding = "DB"
database_name = "squash-account"
database_id = "47df8ba1-503e-41b1-810b-aa57affa8a8b"
migrations_dir = "migrations"

[triggers]
# Once a day: wipe requests nobody answered within PENDING_DAYS
crons = ["17 3 * * *"]

[observability]
enabled = true

# The test Worker (README "Testomgeving"): the same code with its own
# database, so testing never puts data in the real one. Same Firebase project:
# test logins are e-mail addresses with +test. Deploy: npx wrangler deploy --env test
[env.test]
name = "squash-account-test"
workers_dev = false
routes = [{ pattern = "test-account.squashanalyzer.com", custom_domain = true }]

[env.test.vars]
FIREBASE_PROJECT_ID = "squash-analyzer-18fb3"
PENDING_DAYS = "90"
# Testing with one phone sends many matches in a day
SUBMISSIONS_PER_DAY = "200"
DEVICES_PER_HOUR = "20"

[[env.test.d1_databases]]
binding = "DB"
database_name = "squash-account-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.test.triggers]
crons = ["17 3 * * *"]
