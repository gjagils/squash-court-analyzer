# nginx for squashanalyzer.com (Portainer stack 85), mounted at
# /etc/nginx/conf.d/default.conf from /volume1/web/SquashAnalyzer-nginx/.
# The stock nginx:alpine server, plus: apple-app-site-association has no file
# extension, so it needs its JSON type set here (Apple and Android verify links).
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location = /.well-known/apple-app-site-association {
        root   /usr/share/nginx/html;
        default_type application/json;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
