# The website on Cloudflare as a Worker with static assets (the current form
# of Cloudflare Pages; config in server/website-worker/wrangler.jsonc, Worker
# squashanalyzer-site): on a push to main that touches website/, upload the
# folder with wrangler. Needs the repository secrets CLOUDFLARE_API_TOKEN
# ("Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID. Only active once
# WEBSITE_ON_PAGES is set; it is left off on purpose (the site is published by
# hand from the Mac, see docs/opleveren-en-hosting.md) and only runs when
# started by hand. Note: website/screenshots/ and website/teams/ are outside git and
# do not come along in this upload; deploy from the Mac for those.
name: Website (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/deploy-website.yml']
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload website/
    runs-on: ubuntu-latest
    if: vars.WEBSITE_ON_PAGES == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      # An assets deploy replaces the whole site: without the folders that are
      # outside git (screenshots, team zips) the live pages would lose them.
      - name: Refuse without the folders that are outside git
        run: |
          for folder in website/screenshots website/teams; do
            if [ ! -d "$folder" ]; then
              echo "::error::$folder staat buiten git en ontbreekt: publiceer de website vanaf de Mac (docs/opleveren-en-hosting.md)"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes wrangler@4 deploy -c server/website-worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
