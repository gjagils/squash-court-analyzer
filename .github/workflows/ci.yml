# Every push and pull request to main: project rules, the live server, the
# shared Core (Swift and, through Skip, Kotlin), the iOS tests and the Android
# unit tests (T23). Uploads to TestFlight / Google Play stay manual.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Projectregels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/lint.sh

  worker:
    name: Live-Worker (workerd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/live-worker/package-lock.json
      - run: npm ci
        working-directory: server/live-worker
      - run: npm test
        working-directory: server/live-worker

  server:
    name: Live-server (Node, reserve)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: server/live

  core:
    name: Core (Swift + Kotlin)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: swift test
        working-directory: Packages/SquashAnalyzerCore

  ios:
    name: iOS-tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Test on an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit(0)
          sys.exit("no iPhone simulator")')
          xcodebuild test -project SquashAnalyzer.xcodeproj -scheme SquashAnalyzer \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:SquashAnalyzerTests \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO | tail -40

  android:
    name: Android-unittests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unit tests and a debug build
        working-directory: Android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
