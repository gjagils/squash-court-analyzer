# The website on Cloudflare Pages (project squashanalyzer-site): on a push to
# main that touches website/, upload the folder with wrangler. Needs the
# repository secrets CLOUDFLARE_API_TOKEN (with "Cloudflare Pages: Edit") and
# CLOUDFLARE_ACCOUNT_ID. Only active once the Pages project exists (see
# docs/live-beta-afronden-instructie.md, step 9); until then the NAS serves
# the site and this workflow only runs when started by hand.
name: Website (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/deploy-website.yml']
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload website/
    runs-on: ubuntu-latest
    if: vars.WEBSITE_ON_PAGES == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes wrangler@4 pages deploy website --project-name squashanalyzer-site --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
