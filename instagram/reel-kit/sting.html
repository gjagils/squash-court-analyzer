<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Reel intro and outro</title>
<style>
@font-face { font-family: "SA Rounded"; src: url("file:///System/Library/Fonts/SFNSRounded.ttf"); font-weight: 100 900; }
:root { --gold: #F28C26; --line: rgba(242,140,38,0.35); --text-1: #F2EDE6; --text-2: #B3ADA6; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
body { font-family: "SA Rounded", -apple-system, sans-serif; color: var(--text-1); position: relative; }
#glow { position: absolute; inset: 0; }
.c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 90px; }
.c[hidden] { display: none; }
.icon { border-radius: 22.5%; box-shadow: 0 30px 90px rgba(242,140,38,.35); }
.word { font-size: 104px; font-weight: 800; letter-spacing: -2px; margin-top: 70px; }
.word b { color: var(--gold); font-weight: 800; }
.tag { margin-top: 26px; font-size: 34px; font-weight: 700; letter-spacing: 9px; color: var(--gold); }
h1 { font-size: 92px; line-height: 1.05; font-weight: 800; letter-spacing: -1.5px; margin-top: 64px; }
h1 em { font-style: normal; color: var(--gold); }
.pills { display: flex; gap: 22px; margin-top: 48px; }
.pill { display: inline-flex; align-items: center; gap: 16px; padding: 22px 36px; border-radius: 999px; border: 2px solid var(--line);
  background: rgba(242,140,38,.1); font-size: 38px; font-weight: 700; }
.pill svg { width: 40px; height: 40px; fill: var(--gold); }
.link { margin-top: 44px; font-size: 42px; color: var(--text-2); font-weight: 600; }
.link b { color: var(--text-1); }
/* Light ("warm licht", as on the website): sting.html?light */
html.light { --gold: #A94F08; --line: #DEC9B4; --text-1: #26211C; --text-2: #71665B; }
html.light, html.light body { background: #F7F3ED; }
html.light .icon { box-shadow: 0 24px 70px rgba(38,33,28,.22); }
html.light .pill { background: #FFFFFF; }
</style>
<script>if (location.search.indexOf('light') >= 0) document.documentElement.classList.add('light');</script>
</head>
<body>
<div id="glow"></div>
<div class="c" id="intro" hidden>
  <img class="icon" id="i-icon" src="../release-3.0/assets/icon.png" width="360" height="360" alt="">
  <div class="word" id="i-word">Squash<b>Analyzer</b></div>
  <div class="tag" id="i-tag">SCHEIDSEN · COACHEN · DELEN</div>
</div>
<div class="c" id="outro" hidden>
  <img class="icon" id="o-icon" src="../release-3.0/assets/icon.png" width="300" height="300" alt="">
  <h1 id="o-h">Gratis op iPhone <em>én</em> Android.</h1>
  <div class="pills" id="o-pills">
    <span class="pill"><svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>App Store</span>
    <span class="pill"><svg viewBox="0 0 24 24"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24a11.43 11.43 0 0 0-8.94 0L5.65 5.67c-.19-.29-.58-.38-.87-.2-.28.18-.37.54-.22.83L6.4 9.48A10.78 10.78 0 0 0 1 18h22a10.78 10.78 0 0 0-5.4-8.52zM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/></svg>Google Play</span>
  </div>
  <div class="link" id="o-link">Link in de bio · <b>squashanalyzer.com</b></div>
</div>
<script>
// One frame per render: #intro:<t> or #outro:<t>, t in seconds. No CSS
// animations, so every frame is exact when rendered headless.
var p = location.hash.slice(1).split(':'), kind = p[0], t = +p[1];
function clamp(x) { return Math.max(0, Math.min(1, x)); }
function prog(a, b) { return clamp((t - a) / (b - a)); }
function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
function easeBack(x) { var c = 1.7, d = c + 1; return 1 + d * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
function set(id, o, ty, s) {
  var e = document.getElementById(id);
  e.style.opacity = o;
  e.style.transform = 'translateY(' + (ty || 0) + 'px) scale(' + (s == null ? 1 : s) + ')';
}
var g = easeOut(prog(0, 0.7)), pulse = kind === 'outro' ? 0.04 * Math.sin(t * 2.4) : 0;
var glow = document.documentElement.classList.contains('light') ? 0.6 : 1;
document.getElementById('glow').style.background =
  'radial-gradient(' + (500 + 500 * g) + 'px ' + (500 + 500 * g) + 'px at 50% 46%, rgba(242,140,38,' + glow * (0.26 * g + pulse) + '), transparent 70%)';
if (kind === 'intro') {
  document.getElementById('intro').hidden = false;
  var a = prog(0, 0.55);
  set('i-icon', clamp(t / 0.25), 0, 0.4 + 0.6 * easeBack(a));
  document.getElementById('i-icon').style.transform += ' rotate(' + (-12 * (1 - easeOut(a))) + 'deg)';
  var w = easeOut(prog(0.3, 0.7)); set('i-word', w, 36 * (1 - w));
  var tg = easeOut(prog(0.5, 0.9)); set('i-tag', tg, 24 * (1 - tg));
} else {
  document.getElementById('outro').hidden = false;
  var ic = prog(0, 0.4); set('o-icon', clamp(t / 0.2), 0, 0.5 + 0.5 * easeBack(ic));
  var h = easeOut(prog(0.2, 0.6)); set('o-h', h, 40 * (1 - h));
  var pl = easeOut(prog(0.5, 0.9)); set('o-pills', pl, 40 * (1 - pl));
  var l = easeOut(prog(0.75, 1.15)); set('o-link', l, 30 * (1 - l));
}
</script>
</body>
</html>
