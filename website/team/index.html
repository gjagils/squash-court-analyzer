<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teamwedstrijd live – SquashAnalyzer</title>
  <meta name="description" content="Doe mee met een live teamwedstrijd in SquashAnalyzer." />
  <meta name="robots" content="noindex" />
  <meta property="og:title" content="Doe mee met onze teamwedstrijd – SquashAnalyzer" />
  <meta property="og:description" content="Open de link in SquashAnalyzer en zet je eigen partij live." />
  <meta property="og:image" content="https://www.squashanalyzer.com/logo.png?v=4" />
  <link rel="stylesheet" href="../style.css?v=20261005b" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=5" />
  <link rel="icon" type="image/png" sizes="256x256" href="../favicon.png?v=5" />
  <link rel="apple-touch-icon" href="../logo.png?v=4" />
  <style>
    .team-page { max-width: 480px; margin: 0 auto; padding: 32px 20px 56px; }
    .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
    .label { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); font-weight: 600; }
    h1 { font-size: 24px; margin: 8px 0 12px; }
    .code { margin-top: 16px; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; font-family: ui-monospace, Menlo, monospace;
            font-size: 12px; overflow-wrap: anywhere; color: var(--text-2); }
    .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
    .actions a { display: block; text-align: center; padding: 14px; border-radius: 12px; font-weight: 600; }
    .open-app { background: var(--orange); color: #000; }
    .get-app { background: var(--surface); border: 1px solid var(--line); color: var(--text-1); }
    .note { margin-top: 20px; font-size: 13px; color: var(--text-3); }
    .error { color: var(--text-2); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="team-page">
    <div class="card">
      <div class="label">Teamwedstrijd live</div>
      <h1 id="title">Doe mee met de teamwedstrijd</h1>
      <p id="text">Open deze link in SquashAnalyzer: je partij komt dan op de livepagina van de hele teamavond.</p>
      <div class="code" id="code" hidden></div>
    </div>
    <div class="actions" id="actions" hidden>
      <a class="open-app" id="open-app" href="#">Open in SquashAnalyzer</a>
      <a class="get-app" href="https://apps.apple.com/app/squash-analyzer/id6758676921" target="_blank" rel="noopener">Download de app</a>
    </div>
    <p class="note" id="note">De code staat in de link zelf. Deze pagina stuurt niets naar een server en bewaart niets.</p>
  </main>

  <script>
    // The code is "id.key" after the #: 12 characters of a-z and 0-9, a dot, a long key
    (function () {
      var code = (location.hash || "").slice(1);
      var valid = /^[a-z0-9]{12}\.[A-Za-z0-9_-]{20,64}$/.test(code);
      if (!valid) {
        document.getElementById("title").textContent = "Deze link klopt niet";
        document.getElementById("text").textContent = "Vraag je teamgenoot om de uitnodiging opnieuw te delen vanuit SquashAnalyzer (Competitie, Nodig teamgenoten uit).";
        document.getElementById("note").hidden = true;
        return;
      }
      document.getElementById("open-app").href = "squashanalyzer://team#" + code;
      document.getElementById("actions").hidden = false;
      var box = document.getElementById("code");
      box.textContent = code;
      box.hidden = false;
      document.getElementById("text").textContent =
        "Tik op Open in SquashAnalyzer. Lukt dat niet, kopieer dan deze code en plak hem in de app bij Competitie, Deelnemen.";
    })();
  </script>
</body>
</html>
